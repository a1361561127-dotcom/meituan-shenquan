#修改时注意不要破坏空格缩进,yaml不支持Tab键缩进，请使用同等长度空格缩进
name: mtshenquan-aciton
on:
  watch:
    types: started
  workflow_dispatch:
  schedule:
    - cron: '50 2,8,12 * * *' #提前10分钟排队，实际为北京10:50,16:50,20:50启动
jobs:
  mt-action:
    name: my mt-action job
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v2.2.2
        with:
          python-version: 3.7
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: run meituanshenquan scripts
        env:
          serverkey: ${{ secrets.SERVERKEY }}
          pushPlusToken: ${{ secrets.PUSHPLUSTOKEN }}
          yesornot: "n"
          yesornot2: "y"
          webhook: "~"
          token: ${{ secrets.MTTOKEN }}
          on: 1
          left: 0
          wm_latitude: "29868300"
          wm_longitude: "121544000"
          propId: "5"
          exchangeCoinNumber: "1800"
          setexchangedou: "1800"
        run: |
          python mt-action-scripts.py
